name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  model:
    name: Model tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      # Every source file must be in ReSkate's build too (reskate.patch), or the Windows link fails.
      - name: Sources listed in reskate.patch
        run: |
          missing=0
          for f in src/camcorder/*.cpp; do
            grep -q "^+ *Extension/Camcorder/Model/camcorder/$(basename "$f"))\?$" integration/reskate/reskate.patch || { echo "not in ReSkate's build: $f"; missing=1; }
          done
          for f in integration/reskate/Extension/Camcorder/*.cpp; do
            grep -q "^+ *Extension/Camcorder/$(basename "$f"))\?$" integration/reskate/reskate.patch || { echo "not in ReSkate's build: $f"; missing=1; }
          done
          exit $missing

  reskate:
    name: ReSkate with the camcorder (Windows)
    runs-on: windows-2022
    steps:
      # The patch is LF; keep both checkouts byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: camcorder
      # The picture shader is compiled in the game by D3DCompile (fxc's compiler), which is stricter
      # than dxc: compile it here with fxc so a shader error fails the build, not the player's screen.
      - name: Compile the picture shader with fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName | Select-Object -Last 1
          $source = Get-Content camcorder/integration/reskate/Extension/Camcorder/camcorder_warp.cpp -Raw
          $start = $source.IndexOf('R"hlsl(') + 7
          $hlsl = $source.Substring($start, $source.IndexOf(')hlsl"') - $start)
          Set-Content picture.hlsl $hlsl -NoNewline
          & $fxc.FullName /nologo /T vs_5_0 /E picture_vs /O3 /Fo picture_vs.cso picture.hlsl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fxc.FullName /nologo /T ps_5_0 /E picture_ps /O3 /Fo picture_ps.cso picture.hlsl
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check out ReSkate at the pinned commit
        shell: pwsh
        run: |
          $commit = (Get-Content camcorder/integration/reskate/reskate.commit -Raw).Trim()
          git init -q ReSkate
          git -C ReSkate remote add origin https://github.com/Dingo-Shenanigans/ReSkate.git
          git -C ReSkate fetch -q --depth 1 origin $commit
          git -C ReSkate checkout -q FETCH_HEAD
      - name: Install the camcorder
        shell: pwsh
        run: ./camcorder/integration/reskate/install.ps1 -ReSkate ReSkate
      # ReSkate's Spotify device (SpotifyHelper, Rust) links an import library cargo unpacks with
      # its dependencies: fetched before configuring, which looks for it.
      - name: Fetch the Spotify device's Rust dependencies
        shell: pwsh
        run: |
          if (Test-Path ReSkate/SpotifyHelper/Cargo.toml) { cargo fetch --manifest-path ReSkate/SpotifyHelper/Cargo.toml }
      # A modified ReSkate must not send its crashes to the ReSkate developers' crash reports.
      - name: Configure (crash uploads off)
        working-directory: ReSkate
        run: cmake --preset vs2022-x64 "-DDINGOSDK_BACKTRACE_URL="
      - name: Build ReSkate.dll and the launcher
        working-directory: ReSkate
        run: cmake --build --preset release --parallel 4 --target dingosdk_runtime dingosdk_launcher
      - uses: actions/upload-artifact@v4
        with:
          name: ReSkate-camcorder
          path: |
            ReSkate/build/vs2022-x64/Release/ReSkate.dll
            ReSkate/build/vs2022-x64/Release/ReSkateLauncher.exe
          if-no-files-found: error

  # A tag like v0.3.0 publishes the build on the repository's Releases page.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [model, reskate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReSkate-camcorder
          path: package
      - name: Zip the build
        run: |
          cp LICENSE README.md docs/TESTING.md package/
          cd package && zip -r "../ReSkate-camcorder-${GITHUB_REF_NAME}.zip" .
      # The example camera mod, ready to drop into Mods (or upload to the mod browser).
      - name: Zip the example mod
        run: cd examples/mods && zip -r "../../Camcorder-Extras-mod-${GITHUB_REF_NAME}.zip" "Camcorder Extras"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ReSkate-camcorder-*.zip
            Camcorder-Extras-mod-*.zip
          generate_release_notes: true
